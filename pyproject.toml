[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harmony_compositor_service"]

[project]
name = "harmony-compositor"
dynamic = ["version"]
description = "Configuration-driven Harmony service for multi-band/RGB composition."
authors = [
    { name = "Syed Rizvi", email = "syed.r.rizvi@nasa.gov" }
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12,<4.0.0"
dependencies = [
  "dask (>=2026.3.0)",
  "harmony-service-lib (>=2.6.0,<3.0.0)",
  "numpy (>=1.20.0)",
  "xarray (>=2022.11.0)",
  "netCDF4 (>=1.5.6)",
  "requests (>=2.32.0)",
  "jsonschema (>=4.23.0)",
  "earthaccess (>=0.14.0)",
  "pytest>=9.0.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "mypy>=1.9.0",
    "ruff>=0.5.0",
    "pytest-cov>=5.0.0",
    "mkdocs>=1.6.0",
    "markdown-callouts>=0.4.0",
    "markdown-include>=0.8.1",
    "mkdocstrings>=0.25.1",
    "mkdocs-jupyter>=0.24.7",
    "mkdocs-material>=9.5.22",
    "mkdocstrings-python>=1.16.12"
]
harmony = ["harmony-service-lib>=2.0.0"]
integration = ["harmony-py>=0.4.15"]

[dependency-groups]
dev = []

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
exclude = "tests/.*"

[tool.ruff]
builtins = ["ellipsis"]
exclude = [".eggs", "doc", "_typed_ops.pyi"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["E402", "E501", "E731"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests"
]
